[project]
name = "worldengine-validation-client-api"
version = "0.1.0"
description = "FastAPI backend for WorldEngine Validation Client."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "SQLAlchemy>=2.0.30",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
